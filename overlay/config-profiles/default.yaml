# Base config, inherited (deep-merged) by every profile in this directory.
#
# NOTE ON SCHEMA: keys below reflect Hermes Agent's documented config.yaml
# format (model/base_url/custom endpoint flow) as of mid-2026. Before relying
# on this in production, run `hermes model` interactively once (Project Plan
# step 4/5) and diff its generated ~/.hermes/config.yaml against this file —
# the interactive wizard is the source of truth if anything here drifts from
# a newer Hermes release.

# --- Default provider: local Ollama. Free, offline, no API key. ---
# HPA_LOCAL_MODEL (set in overlay/install/01-install-ollama.sh) controls which
# model gets pulled; keep this `default:` value in sync with that env var.
model:
  provider: "custom"
  base_url: "http://localhost:11434/v1"
  default: "qwen2.5:14b"

# --- Cloud providers: configured, never auto-selected. ---
# Credentials for these live in ~/.hermes/.env (populated separately, NOT
# committed to this repo — see .gitignore). None of them are referenced by
# `model:` above, so Hermes never talks to them unless you explicitly run:
#   hermes model                      (full switch, outside a session)
#   /model anthropic:claude-sonnet-4-6  (quick switch, inside a session)
#   /model openai:gpt-5.1               (quick switch, inside a session)
#   /model huggingface:<model-id>       (quick switch, inside a session)
#
# Expected env vars (set these in ~/.hermes/.env yourself, per-machine):
#   ANTHROPIC_API_KEY=...      # or run `hermes model` -> Anthropic OAuth
#   OPENAI_API_KEY=...         # or run `hermes model` -> OpenAI Codex OAuth
#   HF_TOKEN=...
#
# Deliberately absent: fallback_providers:
# We do NOT configure automatic fallback to a cloud provider. Switching to
# cloud is always a manual, explicit action — that's the approval gate.
